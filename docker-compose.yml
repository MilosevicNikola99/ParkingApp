services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_app}
      POSTGRES_USER: ${POSTGRES_USER:-parking_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Parking Management API}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-parking_app}
      DATABASE_USER: ${POSTGRES_USER:-parking_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-parking_app}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parking_app}:${POSTGRES_PASSWORD:-parking_app}@db:5432/${POSTGRES_DB:-parking_app}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-real-environments}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SAME_TEAM_PRIORITY_WINDOW_HOURS: ${SAME_TEAM_PRIORITY_WINDOW_HOURS:-2}
      RECENT_WIN_FAIRNESS_WINDOW_DAYS: ${RECENT_WIN_FAIRNESS_WINDOW_DAYS:-30}
      RECENT_WIN_SOFT_LIMIT: ${RECENT_WIN_SOFT_LIMIT:-2}
      ASSIGNMENT_SCHEDULER_ENABLED: ${ASSIGNMENT_SCHEDULER_ENABLED:-false}
      ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS: ${ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS:-60}
      ASSIGNMENT_SCHEDULER_BATCH_LIMIT: ${ASSIGNMENT_SCHEDULER_BATCH_LIMIT:-100}
      ASSIGNMENT_SCHEDULER_LOCK_KEY: ${ASSIGNMENT_SCHEDULER_LOCK_KEY:-740730001}
      ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY: ${ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      SCHEDULER_METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9101}
      READINESS_DATABASE_TIMEOUT_SECONDS: ${READINESS_DATABASE_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-}
      SEED_ADMIN_UPDATE_PASSWORD: ${SEED_ADMIN_UPDATE_PASSWORD:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  assignment-scheduler:
    profiles:
      - scheduler
      - monitoring
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.commands.run_assignment_scheduler"]
    environment:
      APP_NAME: ${APP_NAME:-Parking Management API}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-parking_app}
      DATABASE_USER: ${POSTGRES_USER:-parking_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-parking_app}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parking_app}:${POSTGRES_PASSWORD:-parking_app}@db:5432/${POSTGRES_DB:-parking_app}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-real-environments}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SAME_TEAM_PRIORITY_WINDOW_HOURS: ${SAME_TEAM_PRIORITY_WINDOW_HOURS:-2}
      RECENT_WIN_FAIRNESS_WINDOW_DAYS: ${RECENT_WIN_FAIRNESS_WINDOW_DAYS:-30}
      RECENT_WIN_SOFT_LIMIT: ${RECENT_WIN_SOFT_LIMIT:-2}
      ASSIGNMENT_SCHEDULER_ENABLED: "true"
      ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS: ${ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS:-60}
      ASSIGNMENT_SCHEDULER_BATCH_LIMIT: ${ASSIGNMENT_SCHEDULER_BATCH_LIMIT:-100}
      ASSIGNMENT_SCHEDULER_LOCK_KEY: ${ASSIGNMENT_SCHEDULER_LOCK_KEY:-740730001}
      ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY: ${ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      SCHEDULER_METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9101}
      READINESS_DATABASE_TIMEOUT_SECONDS: ${READINESS_DATABASE_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      SEED_ADMIN_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${SCHEDULER_METRICS_PORT:-9101}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_started
      assignment-scheduler:
        condition: service_started

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
