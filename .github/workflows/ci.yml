name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          POSTGRES_CONCURRENCY_DATABASE_URL: ""
        run: python -m pytest
      - name: Compile backend and tests
        run: python -m compileall -q app tests
      - name: Validate Alembic graph
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          python -m alembic -c alembic.ini history
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://parking_ci:ci-only-postgres-password@localhost:5432/parking_ci_concurrency
      POSTGRES_CONCURRENCY_DATABASE_URL: postgresql+psycopg://parking_ci:ci-only-postgres-password@localhost:5432/parking_ci_concurrency
      JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parking_ci_concurrency
          POSTGRES_USER: parking_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_ci -d parking_ci_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Migrate fresh PostgreSQL database
        run: |
          python -m alembic -c alembic.ini upgrade head
          head_revision="$(python -m alembic -c alembic.ini heads | awk '{print $1}')"
          current_revision="$(python -m alembic -c alembic.ini current | awk '{print $1}')"
          test -n "$head_revision"
          test "$current_revision" = "$head_revision"
      - name: Run PostgreSQL concurrency tests
        run: |
          python -m pytest -m postgres_concurrency tests/postgres_concurrency --junitxml=postgres-concurrency.xml
          python -c "import xml.etree.ElementTree as ET; root=ET.parse('postgres-concurrency.xml').getroot(); tests=int(root.attrib.get('tests', 0)); skipped=int(root.attrib.get('skipped', 0)); assert tests > 0 and skipped == 0, (tests, skipped)"
      - name: Upload concurrency diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-${{ github.run_id }}
          path: backend/postgres-concurrency.xml
          if-no-files-found: ignore
          retention-days: 5

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit all npm dependencies
        run: npm audit
      - name: Audit production npm dependencies
        run: npm audit --omit=dev
      - name: Audit npm dependencies without optional packages
        run: npm audit --omit=optional

  compose-validation:
    name: Compose and image validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --profile scheduler config --quiet
          docker compose --profile monitoring config --quiet
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.production.yml --profile scheduler config --quiet
      - name: Build bounded application images
        run: |
          docker compose build backend frontend
          docker compose -f docker-compose.production.yml build proxy
