groups:
  - name: parking-app-examples
    rules:
      - alert: BackendNotReady
        expr: parking_readiness_dependency_status{dependency="database"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Backend readiness dependency is failing
          description: PostgreSQL readiness has reported unhealthy for more than 2 minutes.

      - alert: HighServerErrorRate
        expr: sum(rate(parking_http_requests_total{status_class="5xx"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated backend 5xx rate
          description: Tune this threshold for production traffic volume before enabling paging.

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(parking_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High p95 request latency
          description: Backend p95 latency has exceeded the example 1 second threshold.

      - alert: AssignmentSchedulerNoRecentSuccess
        expr: time() - parking_assignment_scheduler_last_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assignment scheduler has no recent successful cycle
          description: Example threshold assumes a 60 second scheduler interval and should be tuned per environment.

      - alert: AssignmentSchedulerCycleFailures
        expr: increase(parking_assignment_scheduler_cycles_total{result="error"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assignment scheduler cycle failures detected
          description: At least one scheduler cycle failed in the last 10 minutes.

      - alert: PostgreSQLReadinessFailure
        expr: parking_readiness_dependency_status{dependency="database"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL readiness failure
          description: Backend readiness cannot complete the lightweight database check.
