global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: parking-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: parking-assignment-scheduler
    metrics_path: /metrics
    static_configs:
      - targets:
          - assignment-scheduler:9101
