services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_app}
      POSTGRES_USER: ${POSTGRES_USER:-parking_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    environment:
      APP_NAME: ${APP_NAME:-Parking Management API}
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-parking_app}
      DATABASE_USER: ${POSTGRES_USER:-parking_app}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ""
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SAME_TEAM_PRIORITY_WINDOW_HOURS: ${SAME_TEAM_PRIORITY_WINDOW_HOURS:-2}
      RECENT_WIN_FAIRNESS_WINDOW_DAYS: ${RECENT_WIN_FAIRNESS_WINDOW_DAYS:-30}
      RECENT_WIN_SOFT_LIMIT: ${RECENT_WIN_SOFT_LIMIT:-2}
      ASSIGNMENT_SCHEDULER_ENABLED: "false"
      ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS: ${ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS:-60}
      ASSIGNMENT_SCHEDULER_BATCH_LIMIT: ${ASSIGNMENT_SCHEDULER_BATCH_LIMIT:-100}
      ASSIGNMENT_SCHEDULER_LOCK_KEY: ${ASSIGNMENT_SCHEDULER_LOCK_KEY:-740730001}
      ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY: ${ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      SCHEDULER_METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9101}
      READINESS_DATABASE_TIMEOUT_SECONDS: ${READINESS_DATABASE_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      CORS_ALLOWED_ORIGINS: '${PRODUCTION_CORS_ALLOWED_ORIGINS:-["https://parking.example.com"]}'
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      SEED_ADMIN_ENABLED: "false"
    expose:
      - "8000"
    secrets:
      - jwt_secret
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  assignment-scheduler:
    profiles:
      - scheduler
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.commands.run_assignment_scheduler"]
    environment:
      APP_NAME: ${APP_NAME:-Parking Management API}
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-parking_app}
      DATABASE_USER: ${POSTGRES_USER:-parking_app}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ""
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SAME_TEAM_PRIORITY_WINDOW_HOURS: ${SAME_TEAM_PRIORITY_WINDOW_HOURS:-2}
      RECENT_WIN_FAIRNESS_WINDOW_DAYS: ${RECENT_WIN_FAIRNESS_WINDOW_DAYS:-30}
      RECENT_WIN_SOFT_LIMIT: ${RECENT_WIN_SOFT_LIMIT:-2}
      ASSIGNMENT_SCHEDULER_ENABLED: "true"
      ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS: ${ASSIGNMENT_SCHEDULER_INTERVAL_SECONDS:-60}
      ASSIGNMENT_SCHEDULER_BATCH_LIMIT: ${ASSIGNMENT_SCHEDULER_BATCH_LIMIT:-100}
      ASSIGNMENT_SCHEDULER_LOCK_KEY: ${ASSIGNMENT_SCHEDULER_LOCK_KEY:-740730001}
      ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY: ${ASSIGNMENT_SCHEDULER_RUN_IMMEDIATELY:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      SCHEDULER_METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9101}
      READINESS_DATABASE_TIMEOUT_SECONDS: ${READINESS_DATABASE_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      CORS_ALLOWED_ORIGINS: '${PRODUCTION_CORS_ALLOWED_ORIGINS:-["https://parking.example.com"]}'
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      SEED_ADMIN_ENABLED: "false"
    secrets:
      - jwt_secret
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${SCHEDULER_METRICS_PORT:-9101}"
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${PRODUCTION_VITE_API_BASE_URL:-/api}
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  tls_certificate:
    file: ./secrets/tls_certificate.pem
  tls_private_key:
    file: ./secrets/tls_private_key.pem

volumes:
  postgres_data:
